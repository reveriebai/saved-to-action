<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>收藏行动看板</title>
<style>
  :root{--ink:#2e2420;--wine:#963f2d;--paper:#efe2d0;--cream:#fff8ee;--line:#b5917b;--muted:#735e53;--sage:#567467}
  *{box-sizing:border-box}body{margin:0;background:#d9c3ad;color:var(--ink);font-family:Georgia,"Songti SC","STSong",serif}.page{max-width:1180px;margin:0 auto;min-height:100vh;background:var(--paper);padding:27px 32px 70px;box-shadow:0 0 50px rgba(50,26,17,.18);background-image:linear-gradient(90deg,transparent 49.93%,rgba(89,45,33,.055) 50%,transparent 50.07%)}
  .masthead{display:grid;grid-template-columns:1fr auto;align-items:end;border-top:4px double var(--ink);border-bottom:4px double var(--ink);padding:15px 0 12px}.eyebrow,.meta,.button,.filter{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--wine)}h1{font-size:50px;letter-spacing:-.09em;line-height:.9;margin:9px 0 0}.masthead p{margin:0;font-style:italic;color:var(--muted);font-size:14px}.bar{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0 9px;font:600 11px ui-sans-serif,-apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase}.bar span:last-child{color:var(--wine)}
  section{margin-top:30px}.section-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:16px}.section-head h2{font-size:29px;letter-spacing:-.065em;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:0;font-style:italic}.today{background:var(--wine);color:var(--cream);padding:27px;min-height:260px;display:flex;flex-direction:column;position:relative;overflow:hidden}.today:after{content:"01";position:absolute;right:14px;top:-29px;font:italic 130px/1 Georgia;color:rgba(255,245,228,.10)}.today .eyebrow{color:#f3c9a4}.today h3{font-size:34px;line-height:1.08;letter-spacing:-.055em;margin:16px 0 12px;max-width:720px;position:relative}.today p{max-width:760px;line-height:1.55;margin:4px 0;position:relative}.button-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:18px;position:relative}.button{border:1px solid currentColor;background:none;color:inherit;font-size:11px;font-weight:700;padding:8px 10px;cursor:pointer}.button.primary{background:var(--cream);color:var(--wine);border-color:var(--cream)}
  .controls{display:flex;flex-wrap:wrap;gap:6px}.filter{border:1px solid var(--line);background:transparent;color:var(--wine);padding:7px 9px;font-size:10px;font-weight:700;cursor:pointer}.filter.active{background:var(--wine);color:var(--cream);border-color:var(--wine)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:18px;background:rgba(255,252,245,.68);border:1px solid rgba(107,69,53,.43);display:flex;min-height:286px;flex-direction:column}.card.tracked{box-shadow:inset 0 5px 0 var(--sage)}.card.done{opacity:.63}.card h3{font:700 16px/1.4 ui-sans-serif,-apple-system,sans-serif;margin:12px 0 8px}.card p{font-size:13px;line-height:1.5;margin:4px 0;color:#58433a}.card .detail{border-top:1px solid rgba(107,69,53,.24);padding-top:9px;margin-top:10px;color:var(--muted)}.card .meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:8px}.card .button{color:var(--wine)}.empty{border:1px dashed var(--line);padding:22px;color:var(--muted);font-size:14px}.footer{margin-top:30px;border-top:4px double var(--ink);padding-top:18px;text-align:center;color:var(--muted);font-size:11px;font-style:italic}
  .revisit{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.7fr);gap:28px;padding:24px;border:1px solid var(--line);background:rgba(255,248,238,.62)}.revisit h3{font-size:27px;line-height:1.15;letter-spacing:-.04em;margin:10px 0 13px}.revisit p{line-height:1.55;margin:7px 0;color:#58433a}.revisit .usage{border-left:3px solid var(--wine);padding-left:13px}.revisit .button{color:var(--wine)}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.page{padding:20px 16px 50px}.masthead{grid-template-columns:1fr}.masthead p{margin-top:10px}h1{font-size:42px}.cards{grid-template-columns:1fr}.section-head{display:block}.controls{margin-top:10px}}
</style>
<body><main class="page">
  <header class="masthead"><div><div class="eyebrow">Personal archive / saved to action</div><h1>收藏行动看板</h1></div><p>把曾经留下的，慢慢变成正在发生的。</p></header>
  <div class="bar"><span id="status">等待本地数据</span><span id="progress">0 件已经落地</span></div>
  <section><div class="section-head"><h2>今天做什么</h2><p>一件行动，一次回看。</p></div><article class="today" id="today"></article></section>
  <section id="revisit-section"><div class="section-head"><h2>旧收藏回看</h2><p>先重新看见，再决定是否行动。</p></div><article class="revisit" id="revisit"></article></section>
  <section><div class="section-head"><div><h2>全部行动</h2><p>原文留在你的 Markdown 文件夹；这里保存行动状态。</p></div><div class="controls" id="filters"></div></div><div class="cards" id="cards"></div></section>
  <section><div class="section-head"><h2>已经落地</h2><p>完成不是归档知识，而是留下发生过的证据。</p></div><div class="cards" id="done"></div></section>
  <footer class="footer">Saved to Action · 所有数据只保存在本机</footer>
</main>
<script>
  let payload={configured:false,message:'等待 App 传入数据。',state:{done:[],tracked:[],burned:[],currentAction:null,custom:[]},actions:[],dailyRevisit:null};
  let activeFilter='全部';
  const $=id=>document.getElementById(id);
  const uniq=(list,id)=>list.includes(id)?list:[...list,id];
  const openActions=()=>payload.actions.filter(x=>!payload.state.done.includes(x.id)&&!payload.state.burned.includes(x.id));
  const actionById=id=>payload.actions.find(x=>x.id===id);
  function sendState(){window.webkit?.messageHandlers?.boardStateDidChange?.postMessage(JSON.stringify(payload.state));render()}
  function openSource(id){window.webkit?.messageHandlers?.openSource?.postMessage(id)}
  function openRevisit(){window.webkit?.messageHandlers?.openRevisit?.postMessage('open')}
  function convertRevisit(){window.webkit?.messageHandlers?.convertRevisit?.postMessage('convert')}
  function current(){let open=openActions();if(!open.length)return null;let found=open.find(x=>x.id===payload.state.currentAction);if(found)return found;payload.state.currentAction=open[0].id;return open[0]}
  function next(){let open=openActions();if(!open.length)return;let index=open.findIndex(x=>x.id===payload.state.currentAction);payload.state.currentAction=open[(index+1+open.length)%open.length].id;sendState()}
  function complete(id){payload.state.done=uniq(payload.state.done,id);payload.state.tracked=payload.state.tracked.filter(x=>x!==id);payload.state.burned=payload.state.burned.filter(x=>x!==id);if(payload.state.currentAction===id)payload.state.currentAction=null;sendState()}
  function burn(id){payload.state.burned=uniq(payload.state.burned,id);payload.state.done=payload.state.done.filter(x=>x!==id);payload.state.tracked=payload.state.tracked.filter(x=>x!==id);if(payload.state.currentAction===id)payload.state.currentAction=null;sendState()}
  function track(id){payload.state.tracked=payload.state.tracked.includes(id)?payload.state.tracked.filter(x=>x!==id):uniq(payload.state.tracked,id);sendState()}
  function button(label,action,primary=false){let b=document.createElement('button');b.className='button'+(primary?' primary':'');b.textContent=label;b.onclick=action;return b}
  function renderToday(){let box=$('today');box.replaceChildren();let item=current();if(!item){let title=document.createElement('h3');title.textContent=payload.message||'暂时没有待处理的行动卡。';box.append(title);return}let meta=document.createElement('div');meta.className='eyebrow';meta.textContent=`${item.category} · 已保存 ${item.savedDays} 天`;let title=document.createElement('h3');title.textContent=item.task;let intent=document.createElement('p');intent.textContent=item.intent;let detail=document.createElement('p');detail.textContent=item.detail||'';let row=document.createElement('div');row.className='button-row';row.append(button('完成这一小步',()=>complete(item.id),true),button(payload.state.tracked.includes(item.id)?'取消追踪':'保留追踪',()=>track(item.id)),button('阅后即焚',()=>burn(item.id)),button('换一张',next));if(item.hasSource)row.append(button('打开原文',()=>openSource(item.id)));box.append(meta,title,intent);if(item.detail)box.append(detail);box.append(row)}
  function card(item,done=false){let article=document.createElement('article');article.className='card'+(done?' done':'')+(payload.state.tracked.includes(item.id)?' tracked':'');let meta=document.createElement('div');meta.className='meta';let left=document.createElement('span');left.textContent=item.category;let right=document.createElement('span');right.textContent=`${item.savedDays} 天`;meta.append(left,right);let title=document.createElement('h3');title.textContent=item.task;let intent=document.createElement('p');intent.textContent=item.intent;article.append(meta,title,intent);if(item.detail){let detail=document.createElement('p');detail.className='detail';detail.textContent=item.detail;article.append(detail)}let row=document.createElement('div');row.className='button-row';if(!done){row.append(button('完成',()=>complete(item.id)),button(payload.state.tracked.includes(item.id)?'取消追踪':'保留追踪',()=>track(item.id)),button('焚毁',()=>burn(item.id)))}if(item.hasSource)row.append(button('打开原文',()=>openSource(item.id)));article.append(row);return article}
  function renderFilters(){let categories=['全部',...new Set(openActions().map(x=>x.category))];let box=$('filters');box.replaceChildren();if(!categories.includes(activeFilter))activeFilter='全部';for(let category of categories){let b=document.createElement('button');b.className='filter'+(activeFilter===category?' active':'');b.textContent=category;b.onclick=()=>{activeFilter=category;render()};box.append(b)}}
  function renderRevisit(){let section=$('revisit-section'),box=$('revisit'),item=payload.dailyRevisit;if(!item){section.style.display='none';return}section.style.display='block';box.replaceChildren();let main=document.createElement('div');let meta=document.createElement('div');meta.className='eyebrow';meta.textContent=`重新发现 · 已保存 ${item.savedDays} 天`;let title=document.createElement('h3');title.textContent=item.title;let summary=document.createElement('p');summary.textContent=item.summary;let side=document.createElement('div');let usage=document.createElement('p');usage.className='usage';usage.textContent=`适合什么时候用：${item.usage}`;let row=document.createElement('div');row.className='button-row';let convert=button(item.converted?'已加入全部行动':'把它变成待办',convertRevisit,true);convert.disabled=item.converted;row.append(convert);if(item.hasSource)row.append(button('打开原文',openRevisit));main.append(meta,title,summary);side.append(usage,row);box.append(main,side)}
  function render(){let open=openActions();$('status').textContent=payload.configured?(payload.message||`${open.length} 张待行动`):payload.message;$('progress').textContent=`${payload.state.done.length} 件已经落地`;renderToday();renderRevisit();renderFilters();let list=activeFilter==='全部'?open:open.filter(x=>x.category===activeFilter);let cards=$('cards');cards.replaceChildren();if(!list.length){let empty=document.createElement('div');empty.className='empty';empty.textContent=payload.message||'这个分类暂时没有行动卡。';cards.append(empty)}else list.forEach(item=>cards.append(card(item)));let done=$('done');done.replaceChildren();let completed=payload.state.done.map(actionById).filter(Boolean);if(!completed.length){let empty=document.createElement('div');empty.className='empty';empty.textContent='还没有完成的行动。';done.append(empty)}else completed.forEach(item=>done.append(card(item,true)))}
  window.applyNativePayloadBase64=value=>{try{let bytes=Uint8Array.from(atob(value),c=>c.charCodeAt(0));payload=JSON.parse(new TextDecoder().decode(bytes));payload.state.custom=payload.state.custom||[];render()}catch(error){payload={configured:false,message:'看板数据无法解析。',state:{done:[],tracked:[],burned:[],currentAction:null,custom:[]},actions:[],dailyRevisit:null};render()}};
  render();
</script></body></html>
