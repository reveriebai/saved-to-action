name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Skill structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("skill/saved-to-action/SKILL.md")
          text = path.read_text(encoding="utf-8")
          assert text.startswith("---\nname: saved-to-action\ndescription:")
          assert "[TODO" not in text
          assert Path("skill/saved-to-action/agents/openai.yaml").is_file()
          PY
      - name: Privacy scan
        run: python3 skill/saved-to-action/scripts/privacy_scan.py .
      - name: Build macOS app
        run: |
          fixture="$RUNNER_TEMP/notes"
          workspace="$RUNNER_TEMP/workspace"
          mkdir -p "$fixture"
          printf '# 示例\n' > "$fixture/example.md"
          python3 skill/saved-to-action/scripts/saved_to_action.py init \
            --workspace "$workspace" --source "示例=$fixture" --mode future
          chmod +x skill/saved-to-action/scripts/build_app.sh
          skill/saved-to-action/scripts/build_app.sh --workspace "$workspace"
          codesign --verify --deep --strict "$workspace/dist/Saved to Action.app"
      - name: App integration tests
        run: |
          xcrun swiftc \
            -module-cache-path "$RUNNER_TEMP/swift-module-cache" \
            -Xcc "-fmodules-cache-path=$RUNNER_TEMP/clang-module-cache" \
            skill/saved-to-action/assets/macos-app/Sources/AppModels.swift \
            skill/saved-to-action/assets/macos-app/Sources/SharedActionStore.swift \
            tests/AppIntegrationTests.swift \
            -o "$RUNNER_TEMP/app-integration-tests"
          "$RUNNER_TEMP/app-integration-tests"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Windows state and path tests
        shell: pwsh
        run: dotnet run --project tests/windows/WindowsIntegrationHarness.csproj --configuration Release
      - name: Build Windows app
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "notes"
          $workspace = Join-Path $env:RUNNER_TEMP "workspace"
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture "example.md") -Value "# 示例" -Encoding utf8
          python skill/saved-to-action/scripts/saved_to_action.py init `
            --workspace $workspace --source "示例=$fixture" --mode future
          & skill/saved-to-action/scripts/build_windows_app.ps1 `
            -Workspace $workspace -Runtime win-x64
          $exe = Join-Path $workspace "dist/windows/win-x64/SavedToAction.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Windows build did not produce SavedToAction.exe"
          }
      - name: Privacy scan
        shell: pwsh
        run: python skill/saved-to-action/scripts/privacy_scan.py .
